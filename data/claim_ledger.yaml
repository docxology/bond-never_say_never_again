# Claim ledger — never_say_never_again (REMOUNT)
# Registers sourced numeric claims for evidence-registry validation.
# All claims are generated from the deterministic domain core, not hand-authored.
schema_version: 1

claims:
  - id: "CLAIM_CMDX_ORIGINAL"
    statement: "Original (identity) command score for THUNDERBALL-65"
    source: "engine.replay(LEGACY_SCENARIO, identity).command_score"
    token: "ORIGINAL_COMMAND_SCORE"
    determinism: true

  - id: "CLAIM_CMDX_REMOUNT"
    statement: "Remount command score for THUNDERBALL-65"
    source: "engine.replay(LEGACY_SCENARIO, REMOUNT_CONFIG).command_score"
    token: "REMOUNT_COMMAND_SCORE"
    determinism: true

  - id: "CLAIM_VERDICT"
    statement: "Overall op-diff verdict"
    source: "diff_outcomes(original, remount).overall"
    token: "OVERALL_VERDICT"
    determinism: true

  - id: "CLAIM_MIGRATED_COUNT"
    statement: "Number of legacy intel dossiers migrated"
    source: "len(LEGACY_INDEX) via mission.execute"
    token: "MIGRATED_ASSET_COUNT"
    determinism: true

  - id: "CLAIM_DETECTION_P"
    statement: "P(adversary alert) over the canonical replay campaign"
    source: "canonical_risk_report().detection_probability"
    token: "RISK_DETECTION_PROBABILITY"
    determinism: true

  - id: "CLAIM_RELIABILITY"
    statement: "Block-structured mission reliability"
    source: "canonical_risk_report().reliability"
    token: "RISK_RELIABILITY"
    determinism: true

  - id: "CLAIM_CAMPAIGN_EV"
    statement: "Campaign expected value (reward minus detection)"
    source: "canonical_risk_report().campaign_ev"
    token: "RISK_CAMPAIGN_EV"
    determinism: true

  - id: "CLAIM_ALLOC_GAIN"
    statement: "Weighted score gain from marginal-gain allocation"
    source: "canonical_allocation().total_gain"
    token: "ALLOC_TOTAL_GAIN"
    determinism: true

  - id: "CLAIM_LEARN_TARGET"
    statement: "First learning-curve iteration reaching the target score"
    source: "canonical_learning_forecast().target_iteration"
    token: "LEARN_TARGET_ITERATION"
    determinism: true
