# Claim ledger — never_say_never_again (REMOUNT)
# Registers sourced numeric claims for evidence-registry validation.
# All claims are generated from the deterministic domain core, not hand-authored.
schema_version: 1

claims:
  - id: "CLAIM_CMDX_ORIGINAL"
    statement: "Original (identity) command score for THUNDERBALL-65"
    source: "engine.replay(LEGACY_SCENARIO, identity).command_score"
    token: "ORIGINAL_COMMAND_SCORE"
    determinism: true

  - id: "CLAIM_CMDX_REMOUNT"
    statement: "Remount command score for THUNDERBALL-65"
    source: "engine.replay(LEGACY_SCENARIO, REMOUNT_CONFIG).command_score"
    token: "REMOUNT_COMMAND_SCORE"
    determinism: true

  - id: "CLAIM_VERDICT"
    statement: "Overall op-diff verdict"
    source: "diff_outcomes(original, remount).overall"
    token: "OVERALL_VERDICT"
    determinism: true

  - id: "CLAIM_MIGRATED_COUNT"
    statement: "Number of legacy intel dossiers migrated"
    source: "len(LEGACY_INDEX) via mission.execute"
    token: "MIGRATED_ASSET_COUNT"
    determinism: true
