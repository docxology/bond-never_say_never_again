# Domain profile — never_say_never_again (REMOUNT)
# Declarative advisory controls. Validation inputs only; do not execute agents.
domain: "legacy mission replay / op diff / asset migration"
film: "never_say_never_again"
codename: "REMOUNT"

review_gates:
  - "pytest --cov=src --cov-fail-under=90"
  - "ruff check src/ scripts/ tests/"
  - "mypy src/ scripts/"
  - "rg template[_]code_project == zero"

source_policy:
  - "pure deterministic math: no random draws, no wall-clock in artifacts"
  - "no mock framework; real data + computation only"
  - "domain core imports neither bond_api nor infrastructure"

artifact_expectations:
  - "output/figures/op_diff_scores.png"
  - "output/figures/asset_distribution.png"
  - "output/data/manuscript_variables.json"
  - "output/data/remount_outcome.json"

benchmark_rubric:
  - "command_score improves original -> remount"
  - "weighted delta sign determines overall verdict"
  - "asset migration preserves integrity fingerprints"
