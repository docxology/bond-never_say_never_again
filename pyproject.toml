# Never Say Never Again — REMOUNT: legacy mission replay / op-diff / asset-migration engine
# Inherits workspace settings from root pyproject.toml

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "never_say_never_again"
version = "0.1.0"
license = {text = "MIT"}
description = "REMOUNT — legacy mission replay/remount engine, op diff/comparison, and legacy asset migration (BOND film package)"
authors = [
    {name = "Daniel Ari Friedman", email = "daniel@activeinference.institute"}
]
requires-python = ">=3.10"
dependencies = [
    "numpy>=2.0.0",
    "matplotlib>=3.9.0",
    "pyyaml>=6.0.2",
    "bond-api",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.9.0",
    "mypy>=1.14.0",
    "types-PyYAML>=6.0.12",
]

# bond-api is a sibling package in the BOND suite (Layer 1 — the frozen
# MissionProvider protocol). Films implement this package's mission.py against it.
# The path is the sibling checkout next to this package (`../bond-api`), so the
# monorepo-by-directory layout resolves in any parent directory — as a sibling
# under the GitVault `docxology/Private/` slot, and as a sibling inside the
# original `projects/working/bond/` tree. Point it at a local bond-api checkout
# before `uv sync` / `uv lock`.
[tool.uv.sources]
bond-api = { path = "../bond-api" }

[tool.pytest.ini_options]
# RASP Strict Assertion: Tests must be clearly separated and structurally identifiable
pythonpath = [".", "src"]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
# `--strict-markers` prevents typos in marker definitions
addopts = "-v --tb=short --strict-markers"

[tool.coverage.run]
# Core Template Rule: We only calculate coverage for primary source code (`src/`),
# ensuring test code itself does not artificially inflate metric scores.
source = ["src"]
branch = true
omit = [
    "tests/*",
    "*/__init__.py",
    "*/test_*.py",
]

[tool.coverage.report]
# ≥90% on src/ is the enforced gate.
fail_under = 90
show_missing = true
precision = 2
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]

[tool.mypy]
# Project-local mypy settings (the monorepo root config has no mypy_path for
# this package's src/ layout). Mirrors the BOND suite gates.
python_version = "3.12"
mypy_path = ["src"]
explicit_package_bases = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
ignore_missing_imports = true

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
# Validation errors across the suite raise ValueError with actionable messages
# (matching bond-api's `_require` helpers); TRY004's Preference for TypeError is
# not followed in the domain core, so it is disabled.
ignore = ["TRY004"]

[tool.ruff.lint.per-file-ignores]
# The phase-0 scaffold used a leading-zero preflight module name.
"scripts/00_preflight.py" = ["N999"]

[tool.uv]
# Inherits workspace settings from root pyproject.toml
